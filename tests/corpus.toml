# Pinned expectations for the third-party corpus.
#
# These exist because every accuracy bug in `graph` shipped with a green test
# suite: the tests asserted behaviour, not correctness, and no test ran against
# code nobody on this project wrote. `scripts/fetch_corpus.py` clones each
# repository at the commit named there; the numbers below are what `graph`
# reports for it.
#
# `unresolved_local` is the important one. It counts paths that were meant to
# name a file in the repository and were not found, so it is a resolver gap
# rather than a property of the project. It should go down over time, never up.
#
# `structural_cycles` is separated from `cycles` because the two mean different
# things. A structural cycle closes through module navigation alone -- a parent
# declaring a child, and the child naming something the parent re-exports -- so
# editing either file cannot break it and it is noise in a blast radius. Only
# `cycles - structural_cycles` are worth acting on. It is zero everywhere now:
# a parent referring to its own child is excluded whatever way it is spelled.
#
# `self_references` was 65, then 60, and is 70, and `python
# e2e/where_self_edges_come_from.py` says where they come from -- which changed
# what the number meant three times over. 41 of the 65 are `use super::*;`
# inside a test module, which is a reference the counting rules call real, and
# most of the `super::Something` group names an item declared in the very file it
# is used in. All of those stay.
#
# What went is five edges whose target was the file the import was written in.
# Two are right to remove: `use fastrand;` in `axum-extra/src/response/
# multiple.rs` and `pub use typed_json;` in `axum-extra/src/response/
# erased_json.rs` are **bare** names for crates from outside this project, and
# both came back as a dependency on the file they were written in.
#
# Three are the cost, and they are the same three edges. `super::JsonLines` in
# `axum-extra/src/json_lines.rs` names a struct declared at line 61 of that file
# and used at line 177, so the reference is real -- but the struct sits inside a
# `pin_project! { }` macro invocation, and tree-sitter does not parse items inside
# a `token_tree`, so the declaration index has no entry for it and the guard
# answers "a crate from outside". `a_struct_inside_a_macro_invocation_is_not_
# declared` in `declarations.rs` asserts the limitation rather than the fix.
# The other two are `super::InvalidFormContentType` and `super::RawFormRejection`
# in `extract/raw_form.rs`, which name items declared in `extract/rejection.rs`
# and so are gaps rather than self-references -- the right answer, but a
# different file from the one the fallback offered.
#
# `internal_edges` did not move, which is the number that matters here: all five
# were self-edges, so removing them is not a lost coupling. `unresolved_local`
# is 6, up from 3, and that is the price of not inventing couplings.
# information about how files depend on each other, so they are excluded from
# `internal_edges` and counted here instead.
#
# To refresh after an intended change: run scripts/fetch_corpus.py, then
# `cargo run -- graph --path <corpus>/<name> --format json` and update the
# numbers here, with the reason in the commit message.

[[corpus]]
name = "axum"
language = "Rust"
# What is left is a pair of `#[macro_export]` macros and a `pub use` re-export the
# declaration index reads as local. A floor of gaps is expected here; it was 66
# before declaration lookup resolved the re-export and crate-root cases, 13 once
# a `pub use http;` of an external crate stopped being counted as a missing
# file, and 3 once grouped re-exports were recorded at all.
#
# Grouping is how crates re-export in practice -- `pub use axum_core::extract::{...}`
# -- and the collector used to record none of them, because walking into the
# group re-checked whether the node it had reached was itself a public use, and a
# `use_list` is not. So six internal edges were missing and five resolver gaps
# were reported against names the crate does re-export. Both numbers moved for
# the same reason and neither is a behaviour change.
unresolved_local = 6
files = 307
# Was 646 internal and 60 self-references before a qualifier-only path
# (`use super::*;` recorded as the bare word `super`) learned to answer at
# all. Both numbers moved, in opposite directions, for three reasons --
# every one of them a correction, and listed because a figure that moves
# during a correctness fix needs its new value justified, not accepted.
#
# Nine of the ten new self-references are example crates whose `main.rs`
# carries `#[cfg(test)] mod tests { use super::*; }`. The glob names the
# root module, which is the file itself, so the reference is real -- but
# the old fall-through left all nine unresolved and counted nowhere.
#
# Two more are in `axum/src/routing/tests/get_to_head.rs`, which has three
# globs. The one at its top names `routing::tests` and still lands on
# `tests/mod.rs`; the two inside its inline modules name the file's own
# module, and the old walk sent all three to `mod.rs`. Those two edges
# moved from internal to self-references, which is most of why internal
# falls.
#
# The tenth went the other way. `examples/compression/src/tests.rs`
# glob-imports its parent, which is the crate root in `main.rs`; the old
# walk landed it on the file itself, where it sat as one of the 60. It now
# resolves to `main.rs` -- one self-reference becomes an internal edge,
# which is why internal falls by one net (646 - 2 + 1) rather than two.
#
# Was 645 before a path whose head names one of the project's own crates
# learned to resolve. `use axum_core::...` inside axum, and `use axum::...`
# inside axum-core's tests, name sibling crates through Cargo's extern
# prelude; the module walks found no directory by those names and filed
# 1066 such imports as third-party dependencies -- plausible, because the
# dependencies are real and sit in `Cargo.toml`, and wrong, because the
# couplings are the workspace's own. 948 of them now resolve -- 883 to
# modules and re-exported items, and 65 to proc-macro derives, whose names
# the declaration index records from the `proc_macro_derive` attribute
# that declares them (the name lives in the attribute, not on the function
# it annotates). What is left names the `http` and `headers` crates
# through axum's re-exports of them, a crate the tree does not contain
# (axum-server), or `#[macro_export]` macros, whose names are declared in
# the file that defines them but are hoisted to the crate root by a rule
# the index does not model. The evidence a name
# is the project's own is a manifest on disk declaring it; a name no
# manifest in the tree declares still stays external.
internal_edges = 1593
self_references = 70
# Edges that only compile when a `#[cfg]` is on. axum gates its public API on
# `feature = "form"` and `feature = "json"`, so an unqualified count would claim
# a dependency a default build does not have.
cfg_gated_edges = 86
# Was 18, and 18 was itself an undercount. The adjacency used to drop every
# `mod child;` declaration, which was meant to keep the Rust module tree out of
# cycle detection but also broke the rings those declarations close. Restoring
# the edge -- because a blast radius genuinely needs it -- and filtering it back
# out for cycles *by kind* instead of by removing it from the graph recovers 19.
# The nineteenth is a real ring of plain `use` statements between two sibling
# modules, e.g. `response/mod.rs` has `use crate::test_helpers::*;` while
# `test_helpers/mod.rs` has `use crate::{extract::Request, response::Response, serve};`.
# The other eighteen still hold.
#
# Twenty now. The added ring is `routing/mod.rs` and `boxed.rs`, two files
# that name each other; it is counted once every edge on it resolves.
cycles = 20
structural_cycles = 0

[[corpus]]
name = "flask"
language = "Python"
# Relative imports resolve fully; the number is a floor to catch regressions,
# not a target to raise.
# Down from 162, and the fall is a correctness fix rather than a quieter
# measurement: `from .app import Flask` leaves two edges, and the second one --
# `.app.Flask` -- was being counted as a path that meant to name a project file
# and could not, when `Flask` is a class inside `app.py` and no file was ever
# expected. 110 of them were a `def` or `class` the parent declares, 47 a
# module-level assignment such as `request = LocalProxy(...)`, which is half of
# what is left once definitions are counted. The sibling import `.app` already
# carried the dependency, so `internal_edges` did not move: no edge was lost,
# only a false alarm removed.
#
# The three that remain are `from . import Flask` in `cli.py`, twice -- which
# binds the name against the package and so has no parent to ask -- and
# `from . import app` in an example whose `app.py` genuinely is missing.
#
# Zero now, and one of the three was never what the note above says.
# `from . import app` in js_example names a package attribute -- the
# example binds `app` in its own `__init__.py` -- not a missing file.
# What was missing, in all three, was the answer to "does the file
# this path's parent resolves to bind the name?", which the gap rule
# asks the declarations. Two things kept it from being answered.
# Import statements did not count among what a Python file declares,
# and `from .app import Flask` is how `flask/__init__.py` binds most
# of its names. And for a path that is one dot and a name, the split
# that finds the parent sliced at the dot and left it empty -- the
# package itself is the parent, and it is asked now.
unresolved_local = 0
# Up from 80 when a zero-byte file stopped being dropped from the graph. The
# three are the empty `__init__.py` files under `tests/`, which are the thing
# that makes each of those directories a package -- and this resolver already
# resolves `from . import X` onto exactly such a file, so counting it as a node
# and pointing an edge at it were two answers to one question that disagreed.
# `src/flask/py.typed` is empty too and is not counted: it has no extension, so
# it matches no language and is not a source file by that measure.
files = 83
# Up from 171 when `from . import helper` stopped being reported as pointing at
# the package's `__init__.py` instead of at the submodule it names.
#
# Up from 185 when an absolute Python import learned to look at the directory
# Python puts on `sys.path`, and not only at the analysis base. flask's packages
# do not sit at its root, so three dependencies were invisible: `from
# js_example import views` in an example, and `from blueprintapp.apps.admin` and
# `...frontend` in that package's `__init__.py`. All three are statements in the
# source and all three now point at files that exist, so this is a recovery
# rather than a revision.
#
# A fourth statement, `from hello import app` in `tests/test_apps/helloworld`,
# deliberately does not resolve. `helloworld` has no `__init__.py` and neither
# does `test_apps`, so there is no package to put the directory on `sys.path`
# through -- the import works only because flask's test setup puts it there
# itself, and nothing in the repository says so. `blueprintapp` next to it does
# have one, and its imports resolve.
internal_edges = 188
# Up from 5 for the same reason as the edges above: `from js_example import views`
# in `js_example/__init__.py` names the package it is already inside, and that
# statement only became visible once absolute imports found their root.
self_references = 6
cfg_gated_edges = 0
# Up from 43, and it is the one cycle through a newly resolved import:
# `examples/javascript/js_example/__init__.py` imports `js_example.views`, and
# `views.py` opens with `from . import app`, which depends on the package's
# `__init__.py` having run. The dependency was there before; the tool could not
# see either end of it.
cycles = 44
# Flask's `__init__.py` is the public API and its modules import back through it,
# so every cycle here involves a real dependency.
structural_cycles = 0

