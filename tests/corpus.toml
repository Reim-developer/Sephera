# Zero unresolved. The last one was `cipher.mih`, an OS/400 system
# header included only under `#elif defined(USE_OS400CRYPTO)`. It is
# not generated and no ignore rule names it; what excuses it is the
# conditional: a preprocessor-gated include names what the build
# supplies in that configuration, and no configuration of this tree
# holds an OS/400 machine-interface header. The same marking makes
# cfg_gated_edges large here -- curl's headers state most of their
# includes inside one conditional or another, which is a property
# of the project the count is now honest about.
#
# Two of the three that stood here are gone, both generated headers:
# `curl_config.h` from configure and `unitprotos.h`, which the build
# writes into `lib/` (its generators are in `lib/CMakeLists.txt` and
# `lib/Makefile.am`) while the include sits in `tests/libtest/`. The
# evidence in both cases is `lib/.gitignore`, which names each file:
# the project's own declaration that neither is source. A generated
# header's home need not be beside its includer, so the gap rule also
# asks each directory's own ignore files about a bare include's name,
# and accepts the answer only when exactly one directory names it.
#
# There were seven. The other four were Python, not C: `from . import
# CurlClient` and its siblings in `tests/http/testenv`, naming names
# the package's `__init__` binds by importing them. They were called
# a floor here; they were the same unasked question flask's entry
# documents, and they are excused now that an import counts among
# what a Python file declares and the gap rule can ask the package
# about a name bound against it. No edge moved -- the module halves
# carried those couplings all along. Only the gap count was wrong.
unresolved_local = 0
