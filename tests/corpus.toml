# Pinned expectations for the third-party corpus.
#
# These exist because every accuracy bug in `graph` shipped with a green test
# suite: the tests asserted behaviour, not correctness, and no test ran against
# code nobody on this project wrote. `scripts/fetch_corpus.py` clones each
# repository at the commit named there; the numbers below are what `graph`
# reports for it.
#
# `unresolved_local` is the important one. It counts paths that were meant to
# name a file in the repository and were not found, so it is a resolver gap
# rather than a property of the project. It should go down over time, never up.
#
# `structural_cycles` is separated from `cycles` because the two mean different
# things. A structural cycle closes through module navigation alone -- a parent
# declaring a child, and the child naming something the parent re-exports -- so
# editing either file cannot break it and it is noise in a blast radius. Only
# `cycles - structural_cycles` are worth acting on. It is zero everywhere now:
# a parent referring to its own child is excluded whatever way it is spelled.
#
# `self_references` was 65 and is 58, and `python
# e2e/where_self_edges_come_from.py` says where they come from -- which changed
# what the number meant. 41 of the 65 are `use super::*;` inside a test module,
# which is a reference the counting rules call real, and most of the
# `super::Something` group names an item declared in the very file it is used in.
# All of those stay.
#
# What went is seven edges whose target was the file the import was written in
# and which no compiler agrees on. Six are right to remove: `use fastrand;` and
# `pub use typed_json;` name crates from outside this project, in files that are
# not the crate root and so were never checked for external re-exports; and
# `use super::InvalidFormContentType` and `use super::RawFormRejection` in
# `extract/raw_form.rs` name items declared in `extract/rejection.rs`, which is a
# different file.
#
# The seventh, `super::JsonLines` in `axum-extra/src/json_lines.rs`, is a
# mistake. `pub struct JsonLines` is declared at line 61 of that same file and
# used at line 177, so the reference is real; it is now counted as an external
# dependency. `file_declares` is asked whether the file declares the name and
# answers no, which it should not for a struct carrying generic parameters and a
# default. One edge, and recorded here rather than left to look like a rounding.
#
# `internal_edges` did not move, which is the number that matters here: the seven
# were self-edges and their removal is not a lost coupling.
#
# `unresolved_local` was 3 and is 8, and that is the cost. Refusing the fallback
# turns a false self-edge into a gap rather than into the right answer, and five
# of these are paths the resolver cannot place. A gap is visible and has a count
# a reader can act on; a self-dependency out of a crate that is not in the project
# is neither. Six of one and five of the other is the trade, and it is recorded
# here rather than left to look like noise either way.
# information about how files depend on each other, so they are excluded from
# `internal_edges` and counted here instead.
#
# To refresh after an intended change: run scripts/fetch_corpus.py, then
# `cargo run -- graph --path <corpus>/<name> --format json` and update the
# numbers here, with the reason in the commit message.

[[corpus]]
name = "axum"
language = "Rust"
# What is left is a pair of `#[macro_export]` macros and a `pub use` re-export the
# declaration index reads as local. A floor of gaps is expected here; it was 66
# before declaration lookup resolved the re-export and crate-root cases, 13 once
# a `pub use http;` of an external crate stopped being counted as a missing
# file, and 3 once grouped re-exports were recorded at all.
#
# Grouping is how crates re-export in practice -- `pub use axum_core::extract::{...}`
# -- and the collector used to record none of them, because walking into the
# group re-checked whether the node it had reached was itself a public use, and a
# `use_list` is not. So six internal edges were missing and five resolver gaps
# were reported against names the crate does re-export. Both numbers moved for
# the same reason and neither is a behaviour change.
unresolved_local = 8
files = 307
internal_edges = 646
self_references = 58
# Edges that only compile when a `#[cfg]` is on. axum gates its public API on
# `feature = "form"` and `feature = "json"`, so an unqualified count would claim
# a dependency a default build does not have.
cfg_gated_edges = 86
# Was 18, and 18 was itself an undercount. The adjacency used to drop every
# `mod child;` declaration, which was meant to keep the Rust module tree out of
# cycle detection but also broke the rings those declarations close. Restoring
# the edge -- because a blast radius genuinely needs it -- and filtering it back
# out for cycles *by kind* instead of by removing it from the graph recovers 19.
# The nineteenth is a real ring of plain `use` statements between two sibling
# modules, e.g. `response/mod.rs` has `use crate::test_helpers::*;` while
# `test_helpers/mod.rs` has `use crate::{extract::Request, response::Response, serve};`.
# The other eighteen still hold.
cycles = 19
structural_cycles = 0

[[corpus]]
name = "flask"
language = "Python"
# Relative imports resolve fully; the number is a floor to catch regressions,
# not a target to raise.
unresolved_local = 0
# Up from 80 when a zero-byte file stopped being dropped from the graph. The
# three are the empty `__init__.py` files under `tests/`, which are the thing
# that makes each of those directories a package -- and this resolver already
# resolves `from . import X` onto exactly such a file, so counting it as a node
# and pointing an edge at it were two answers to one question that disagreed.
# `src/flask/py.typed` is empty too and is not counted: it has no extension, so
# it matches no language and is not a source file by that measure.
files = 83
# Up from 171 when `from . import helper` stopped being reported as pointing at
# the package's `__init__.py` instead of at the submodule it names.
internal_edges = 185
self_references = 5
cfg_gated_edges = 0
cycles = 43
# Flask's `__init__.py` is the public API and its modules import back through it,
# so every cycle here involves a real dependency.
structural_cycles = 0

[[corpus]]
name = "express"
language = "JavaScript"
# Relative imports resolve fully, including the package root that
# `require('../..')` names from every example. Up from 63 edges when the
# root-relative path produced `/index.js` instead of `index.js`.
unresolved_local = 0
files = 141
internal_edges = 159
self_references = 0
cfg_gated_edges = 0
cycles = 0
structural_cycles = 0