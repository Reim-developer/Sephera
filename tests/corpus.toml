[[corpus]]
name = "pytest"
language = "Python"
# The second Python repository, added because flask could not exhibit
# the shape: a large package under `src/` whose modules name each
# other's items through the package -- `from _pytest._io import
# TerminalWriter`. The couplings were never missing: the module half
# of every such statement already edged the module it names, which
# is why internal_edges is unremarkable. What was missing was the
# answer to "does the file this path's parent resolves to bind the
# name?" -- the question the gap rule asks the declarations, and
# the declarations did not count the names an import binds, which
# in an `__init__` is most of them. Fifty statements were counted
# as resolver gaps on that account; eight are.
#
# The eight were in two families. Seven named `_pytest._version`, a
# module setuptools_scm generates at build time; a source checkout
# legitimately does not hold it, and `src/_pytest/__init__.py` says
# so itself by catching the ImportError. They are excused now on the
# project's own evidence: the root `.gitignore` names
# `src/_pytest/_version.py` outright. (The names that `__init__`
# binds in the `try` and the `except` are declared, which is why
# `__version__` itself was never among the eight.)
#
# The last one was `_pytest._argcomplete.filescompleter`, bound
# under `if os.environ.get("_ARGCOMPLETE"):` in `_argcomplete.py`.
# That restraint -- never look through a module-level `if` -- was
# broader than its reason. What `if TYPE_CHECKING:` needs kept out
# is a name bound on only one path; `filescompleter` is bound in
# both branches (a completer in one, `None` in the other), so it is
# a module attribute whichever world runs, and the declarations now
# record exactly the names an `if`/`elif`/`else` chain binds on
# every path through it. A bare annotation in a branch binds
# nothing and does not count. Zero.
unresolved_local = 0
files = 274
internal_edges = 870
self_references = 4
cfg_gated_edges = 0
cycles = 91
structural_cycles = 0
