[workspace]
members = [
    "crates/sephera_cli",
    "crates/sephera_core",
    "crates/sephera_mcp",
    "crates/sephera_tools",
    "crates/sephera_scan",
    "crates/sephera_ignore",
    "crates/sephera_compression",
    "crates/sephera_context",
    "crates/sephera_runtime",
    "crates/sephera_symbols",
    "crates/sephera_graph",
    "crates/sephera_graph_rust",
    "crates/sephera_graph_python",
    "crates/sephera_graph_javascript",
    "crates/sephera_graph_go",
    "crates/sephera_graph_java",
    "crates/sephera_graph_cpp",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.7.1"
edition = "2024"
authors = ["reim"]
license = "GPL-3.0-only"
repository = "https://github.com/Reim-developer/Sephera"
homepage = "https://sephera.vercel.app"
rust-version = "1.85"

[workspace.dependencies]
sephera_core = { path = "crates/sephera_core", version = "0.7.1" }
sephera_mcp = { path = "crates/sephera_mcp", version = "0.7.1" }
sephera_scan = { path = "crates/sephera_scan", version = "0.7.1" }
sephera_ignore = { path = "crates/sephera_ignore", version = "0.7.1" }
sephera_compression = { path = "crates/sephera_compression", version = "0.7.1" }
sephera_context = { path = "crates/sephera_context", version = "0.7.1" }
sephera_runtime = { path = "crates/sephera_runtime", version = "0.7.1" }
sephera_symbols = { path = "crates/sephera_symbols", version = "0.7.1" }
sephera_graph = { path = "crates/sephera_graph", version = "0.7.1" }
sephera_graph_rust = { path = "crates/sephera_graph_rust", version = "0.7.1" }
sephera_graph_python = { path = "crates/sephera_graph_python", version = "0.7.1" }
sephera_graph_javascript = { path = "crates/sephera_graph_javascript", version = "0.7.1" }
sephera_graph_go = { path = "crates/sephera_graph_go", version = "0.7.1" }
sephera_graph_java = { path = "crates/sephera_graph_java", version = "0.7.1" }
sephera_graph_cpp = { path = "crates/sephera_graph_cpp", version = "0.7.1" }
# `default-features = false` drops the HTML report generator. Criterion still
# prints the numbers CI needs to compare, and the report site is a local
# convenience that would otherwise add a template engine to every build.
criterion = { version = "0.7", default-features = false }

[profile.release]
opt-level = 3
# `fat`, not `thin`. Every hot loop here is a small function called across a
# crate boundary -- a language plugin's extractor called from the graph resolver
# called from the report -- and thin LTO only inlines what the optimiser can see
# through a thin slice of the program.
#
# Measured on this repository, best of five runs each: `symbols` 64.2 ms -> 55.0
# and `graph` 90.5 ms -> 82.0, against a clean release build going from 105 s to
# 243 s. `panic = "abort"` was measured beside it and is *slower* to run
# (57.9 ms) while giving up the message a panic would have printed, so it is
# deliberately not set.
lto = "fat"
codegen-units = 1
strip = "symbols"

# Benchmarks measure the code under a comment, so they get the same optimisation
# settings as release. Without this they would be timed at `opt-level = 0` in
# debug and every number would describe the wrong build. `thin` rather than `fat`
# only because criterion runs the whole set several times over and the numbers it
# compares are between runs, not against a previous release.
[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
