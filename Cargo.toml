[workspace]
members = [
    "crates/sephera_cli",
    "crates/sephera_core",
    "crates/sephera_mcp",
    "crates/sephera_tools",
    "crates/sephera_scan",
    "crates/sephera_ignore",
    "crates/sephera_compression",
    "crates/sephera_context",
    "crates/sephera_runtime",
    "crates/sephera_symbols",
    "crates/sephera_graph",
    "crates/sephera_graph_rust",
    "crates/sephera_graph_python",
    "crates/sephera_graph_javascript",
    "crates/sephera_graph_go",
    "crates/sephera_graph_java",
    "crates/sephera_graph_cpp",
    "crates/sephera_gui",
]
exclude = ["fuzz", "gui"]
resolver = "3"

[workspace.package]
version = "0.7.1"
edition = "2024"
authors = ["reim"]
license = "GPL-3.0-only"
repository = "https://github.com/Reim-developer/Sephera"
homepage = "https://sephera.vercel.app"
rust-version = "1.85"

[workspace.dependencies]
sephera_core = { path = "crates/sephera_core", version = "0.7.1" }
sephera_mcp = { path = "crates/sephera_mcp", version = "0.7.1" }
sephera_scan = { path = "crates/sephera_scan", version = "0.7.1" }
sephera_ignore = { path = "crates/sephera_ignore", version = "0.7.1" }
sephera_compression = { path = "crates/sephera_compression", version = "0.7.1" }
sephera_context = { path = "crates/sephera_context", version = "0.7.1" }
sephera_runtime = { path = "crates/sephera_runtime", version = "0.7.1" }
sephera_symbols = { path = "crates/sephera_symbols", version = "0.7.1" }
sephera_graph = { path = "crates/sephera_graph", version = "0.7.1" }
sephera_graph_rust = { path = "crates/sephera_graph_rust", version = "0.7.1" }
sephera_graph_python = { path = "crates/sephera_graph_python", version = "0.7.1" }
sephera_graph_javascript = { path = "crates/sephera_graph_javascript", version = "0.7.1" }
sephera_graph_go = { path = "crates/sephera_graph_go", version = "0.7.1" }
sephera_graph_java = { path = "crates/sephera_graph_java", version = "0.7.1" }
sephera_graph_cpp = { path = "crates/sephera_graph_cpp", version = "0.7.1" }
# `default-features = false` drops the HTML report generator. Criterion still
# prints the numbers CI needs to compare, and the report site is a local
# convenience that would otherwise add a template engine to every build.
criterion = { version = "0.7", default-features = false }

[profile.dev]
# No incremental compilation. It was 22 GiB of `target/debug/incremental` -- half
# of a 44 GiB `target/` directory -- and it buys rebuild speed.
#
# The trade is a real one and was made deliberately. A workspace of sixteen crates
# rebuilds from scratch on a fingerprint change either way, because what usually
# invalidates it is a shared crate rather than one leaf file, and incremental only
# pays for the edit-one-file loop. Twenty-two gigabytes of disk to hold a cache
# that a change to `sephera_core` throws away anyway is the wrong end of the trade
# for a tree this wide.
#
# `incremental` is honoured only on `dev` and `release`; the test profile ignores
# it, so `cargo test` was never paying for it. Measured after a clean rebuild:
# `target/debug/incremental` is 0 bytes rather than 22 GiB, and `target/` goes from
# 44.38 GiB to 3.20 GiB in total -- the remaining 3 GiB is the release tree at
# 0.69 GiB plus the debug tree's debug info, which is load-bearing for coverage.
#
# This cannot reach a shipped binary. `[profile.release]` below is a separate
# profile with its own settings, and adding this block was verified empirically
# rather than by argument: with the release tree warm, adding `[profile.dev]`
# recompiled nothing at all (`cargo build --release` finished in 0.26 s with no
# `Compiling` lines). Comparing the release binary by hash was tried first and is
# invalid here -- two clean release builds with an identical `Cargo.toml` produce
# different hashes, so the method cannot resolve a change this small.
#
# `debug` was left at the default, and the measurement that settles it is worth
# recording. `debug = "line-tables-only"` drops the `.pdb` files from 1.01 GiB to
# 0.13 GiB while keeping `file:line:column` in a panic -- which is what a test
# failure needs, and all 796 tests still pass with it set. It also takes line
# coverage from 92.40% to 35.25%, because `cargo llvm-cov` attributes a source
# region through the debug info's column data and line tables have none. The
# coverage job gates at 85 and would fail, so the 900 MiB is cheaper than the
# gate. If coverage is ever measured without llvm-cov, this is the first thing to
# revisit: it is 900 MiB for the cost of a number nothing currently reads.
incremental = false

# The GUI's build, and the reason it is its own profile rather than `release`.
#
# `[profile.release]` below is `lto = "fat"` and `codegen-units = 1` because a
# hot loop crossing a crate boundary is what this tool is. A GUI is not that: it
# spends effectively all of its wall time idle in the event loop, and the one
# thing it does is count lines, which `sephera_scan` already does in parallel
# over `mmap`. Fat LTO over `winit`, a graphics backend and a font stack would
# add minutes to every release build to optimise code that is waiting for a
# mouse click.
#
# So the CLI keeps the measured profile and the GUI gets this one:
#
#     cargo build --release -p sephera        # fat LTO, unchanged
#     cargo build -p sephera_gui --profile release-gui
#
# Measured from clean, in a fresh `target/`, each built once:
#
#     -p sephera, --release                   2m 30s   0.66 GiB   exe 14.7 MB
#     -p sephera_gui, --profile release-gui   2m 57s   1.29 GiB   exe 16.7 MB
#     both                                    —        1.95 GiB
#
# And the reason it is a separate profile rather than just `release`. Building the
# GUI *with* `--release`, in a separate target directory so nothing was shared:
#
#     -p sephera_gui, --release               4m 19s   1.24 GiB   exe 14.4 MB
#
# So thin LTO builds in 68% of the time and costs 2.3 MB of binary -- which is the
# right way round for a window that waits for clicks. `opt-level = 3` is inherited,
# so the counting itself is not the thing being traded away.
#
# The profiles write to different directories, so building one never invalidates
# the other.
[profile.release-gui]
# Inherits `release`'s `opt-level = 3`, `strip = "symbols"` and panic settings,
# then overrides only the two this profile exists to change. A profile without
# `inherits` is rejected outright -- cargo requires it for anything that is not
# `dev` or `release` -- and that is the right default: a custom profile that
# started from nothing would silently be `opt-level = 0`.
inherits = "release"
lto = "thin"
codegen-units = 16

[profile.release]
opt-level = 3
# `fat`, not `thin`. Every hot loop here is a small function called across a
# crate boundary -- a language plugin's extractor called from the graph resolver
# called from the report -- and thin LTO only inlines what the optimiser can see
# through a thin slice of the program.
#
# Measured on this repository, best of five runs each: `symbols` 64.2 ms -> 55.0
# and `graph` 90.5 ms -> 82.0, against a clean release build going from 105 s to
# 243 s. `panic = "abort"` was measured beside it and is *slower* to run
# (57.9 ms) while giving up the message a panic would have printed, so it is
# deliberately not set.
lto = "fat"
codegen-units = 1
strip = "symbols"

# Benchmarks measure the code under a comment, so they get the same optimisation
# settings as release. Without this they would be timed at `opt-level = 0` in
# debug and every number would describe the wrong build. `thin` rather than `fat`
# only because criterion runs the whole set several times over and the numbers it
# compares are between runs, not against a previous release.
[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1