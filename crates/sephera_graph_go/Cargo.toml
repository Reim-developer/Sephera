[package]
name = "sephera_graph_go"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Go dependency extraction for Sephera graph."
documentation = "https://docs.rs/sephera_graph_go"
readme = "README.md"
keywords = ["go", "golang", "dependencies", "tree-sitter", "go-mod"]
categories = ["development-tools", "text-processing"]

[lib]
name = "sephera_graph_go"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
tree-sitter = "0.26"
tree-sitter-go = "0.25"

sephera_core = { path = "../sephera_core", version = "0.7.0" }
sephera_compression = { path = "../sephera_compression", version = "0.7.0" }

sephera_symbols = { path = "../sephera_symbols", version = "0.7.0" }

# No dev-dependencies, deliberately. The one plugin that reads a manifest used to
# depend on `sephera_graph` for `ManifestIndex` -- and `sephera_graph` depends on
# this crate for the registry. Cargo builds that cycle happily and `cargo publish`
# refuses it: dependencies resolve from crates.io, where the `sephera_graph` in
# the same release does not exist yet, so it fails with `no matching package
# named sephera_graph`. The tests implement `ModuleManifestLookup` from
# `sephera_core` instead, which is the contract the plugin actually has.