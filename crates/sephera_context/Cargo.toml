[package]
name = "sephera_context"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Deterministic, token-budgeted context pack building for LLM prompts."
documentation = "https://docs.rs/sephera_context"
readme = "README.md"
keywords = ["context", "llm", "token-budget", "repository"]
categories = ["development-tools", "text-processing"]

[lib]
name = "sephera_context"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

sephera_compression = { path = "../sephera_compression", version = "0.7.0" }
sephera_core = { path = "../sephera_core", version = "0.7.0" }
sephera_ignore = { path = "../sephera_ignore", version = "0.7.0" }
sephera_scan = { path = "../sephera_scan", version = "0.7.0" }

[dev-dependencies]
tempfile = "3.23.0"