[package]
name = "sephera"
version.workspace = true
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Know what breaks before you touch it. Reverse dependency analysis and cycle detection for 8 languages, token-budgeted context packs, and a built-in MCP server."
documentation = "https://docs.rs/sephera"
readme = "README.crates-io.md"
keywords = ["loc", "context", "mcp", "llm", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]
default-run = "sephera"
autobins = false

[[bin]]
name = "sephera"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
comfy-table = "7.2.1"
indicatif = "0.18.4"
notify = "8.2.0"
sephera_core.workspace = true
sephera_mcp.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1", features = ["rt"] }
toml = "0.9.8"

[dev-dependencies]
insta = { version = "1.46.3", features = ["filters"] }
tempfile = "3.23.0"
