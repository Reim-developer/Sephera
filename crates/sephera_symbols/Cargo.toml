[package]
name = "sephera_symbols"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Symbol extraction and declaration analysis across languages."
documentation = "https://docs.rs/sephera_symbols"
readme = "README.md"
keywords = ["symbols", "ast", "tree-sitter", "declarations", "imports"]
categories = ["development-tools", "text-processing"]

[lib]
name = "sephera_symbols"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
memchr = "2.7.6"
phf = { version = "0.11.3", features = ["macros"] }
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tree-sitter = "0.26"

sephera_core = { path = "../sephera_core", version = "0.6.0" }
sephera_ignore = { path = "../sephera_ignore", version = "0.6.0" }
sephera_context = { path = "../sephera_context", version = "0.6.0" }
sephera_compression = { path = "../sephera_compression", version = "0.6.0" }
sephera_scan = { path = "../sephera_scan", version = "0.6.0" }

[dev-dependencies]
tempfile = "3.23.0"