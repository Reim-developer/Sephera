[package]
name = "sephera_ignore"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Git-aware ignore rules (.gitignore, .sepheraignore) with globset matching."
documentation = "https://docs.rs/sephera_ignore"
readme = "README.md"
keywords = ["gitignore", "glob", "ignore", "filesystem"]
categories = ["development-tools", "filesystem"]

[lib]
name = "sephera_ignore"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
globset = "0.4.18"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
walkdir = "2.5.0"

sephera_core = { path = "../sephera_core", version = "0.7.1" }

[dev-dependencies]
tempfile = "3.23.0"