[package]
name = "sephera_mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "MCP server for Sephera — exposes LOC analysis, context packs, and dependency graphs to AI agents over the Model Context Protocol."
documentation = "https://docs.rs/sephera_mcp"
keywords = ["mcp", "ai", "context", "llm", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]

[lib]
crate-type = ["rlib"]

[dependencies]
sephera_compression = { path = "../sephera_compression", version = "0.6.0" }
sephera_context = { path = "../sephera_context", version = "0.6.0" }
sephera_ignore = { path = "../sephera_ignore", version = "0.6.0" }
anyhow = "1"
rmcp = { version = "1.3.0", features = ["server", "macros", "transport-io"] }
schemars = "1"
sephera_core = { path = "../sephera_core", version = "0.6.0" }
sephera_graph = { path = "../sephera_graph", version = "0.6.0" }
sephera_runtime = { path = "../sephera_runtime", version = "0.6.0" }
sephera_scan = { path = "../sephera_scan", version = "0.6.0" }
sephera_symbols = { path = "../sephera_symbols", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3.23.0"
