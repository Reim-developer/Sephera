[package]
name = "sephera_scan"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Fast line-of-code counting with language-aware comment detection."
documentation = "https://docs.rs/sephera_scan"
readme = "README.md"
keywords = ["loc", "code-metrics", "tree-sitter", "scanner"]
categories = ["development-tools", "text-processing"]

[lib]
name = "sephera_scan"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
globset = "0.4.18"
memchr = "2.7.6"
phf = { version = "0.11.3", features = ["macros"] }
rayon = "1.11.0"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
tree-sitter = "0.26"
walkdir = "2.5.0"

sephera_core = { path = "../sephera_core", version = "0.6.0" }
sephera_ignore = { path = "../sephera_ignore", version = "0.6.0" }

[dev-dependencies]
insta = { version = "1.46.3", features = ["filters"] }
tempfile = "3.23.0"

[[bench]]
name = "loc_scan"
path = "../sephera_core/benches/loc_scan.rs"
harness = false