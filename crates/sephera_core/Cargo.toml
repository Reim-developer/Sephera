[package]
name = "sephera_core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Shared analysis engine behind the Sephera CLI for LOC metrics, context building, and Tree-sitter AST compression."
documentation = "https://docs.rs/sephera_core"
readme = "README.crates-io.md"
keywords = ["loc", "context", "tree-sitter", "compression", "scanner"]
categories = ["development-tools", "text-processing"]

[lib]
crate-type = ["rlib"]

[dependencies]
anyhow = "1.0.102"
globset = "0.4.18"
memmap2 = "0.9.9"
# SIMD byte and substring search. `regex` already pulls it in transitively, so
# naming it directly adds no new package to the tree -- but the LOC scanner needs
# it in hand to find newlines and comment delimiters, which is a different job
# from matching a pattern.
memchr = "2.7.6"
phf = { version = "0.11.3", features = ["macros"] }
rayon = "1.11.0"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = { version = "3.23.0", optional = true }
toml = "0.9.8"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-c = "0.23"
url = "2.5.7"
walkdir = "2.5.0"
# Only for the one long git command a `--url` analysis runs. `process` and
# `signal` are what the clone needs to be interruptible; the scheduler features are
# deliberately absent, because this crate starts no runtime of its own -- the CLI
# and the MCP server both already have one, and a second would be two schedulers
# arguing over the same cores.
tokio = { version = "1", features = ["macros", "process", "rt", "signal", "sync"] }

[dev-dependencies]
criterion = { workspace = true }
tempfile = { version = "3.23.0", optional = true }
# `time` only bounds the interrupt tests, so that a regression fails them instead
# of hanging the suite -- the bug being guarded makes a future wait for a second
# signal that never comes, and a hang is indistinguishable from a slow runner.
tokio = { version = "1", features = ["macros", "rt", "time"] }

# Every benchmark needs `harness = false`; a bench target that keeps the built-in
# harness is timed by libtest's own stopwatch and reports no throughput, which is
# how a benchmark target can sit in the tree looking authoritative while
# measuring nothing.
[[bench]]
name = "loc_scan"
harness = false
