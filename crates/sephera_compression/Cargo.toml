[package]
name = "sephera_compression"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Tree-sitter AST compression: skeleton, signatures, and structure extraction."
documentation = "https://docs.rs/sephera_compression"
readme = "README.md"
keywords = ["tree-sitter", "compression", "ast", "llm-context"]
categories = ["development-tools", "text-processing"]

[lib]
name = "sephera_compression"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
memchr = "2.7.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-c = "0.23"

sephera_core = { path = "../sephera_core", version = "0.7.1" }

[dev-dependencies]
tempfile = "3.23.0"

