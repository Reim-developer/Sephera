[package]
name = "sephera_runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Source resolution: local paths, git clones (shallow), remote URLs, config loading."
documentation = "https://docs.rs/sephera_runtime"
readme = "README.md"
keywords = ["git", "clone", "url", "source", "config"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "sephera_runtime"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
tempfile = "3.23.0"
tokio = { version = "1", features = ["macros", "process", "rt", "signal", "sync"] }
url = "2.5.7"
toml = "0.9.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sephera_compression = { path = "../sephera_compression", version = "0.7.1" }
sephera_context = { path = "../sephera_context", version = "0.7.1" }
sephera_scan = { path = "../sephera_scan", version = "0.7.1" }
sephera_symbols = { path = "../sephera_symbols", version = "0.7.1" }

sephera_core = { path = "../sephera_core", version = "0.7.1" }
sephera_ignore = { path = "../sephera_ignore", version = "0.7.1" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
tempfile = "3.23.0"