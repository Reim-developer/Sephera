[package]
name = "sephera_runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Source resolution: local paths, git clones (shallow), remote URLs, config loading."
documentation = "https://docs.rs/sephera_runtime"
readme = "README.md"
keywords = ["git", "clone", "url", "source", "config"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "sephera_runtime"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
tempfile = "3.23.0"
tokio = { version = "1", features = ["macros", "process", "rt", "signal", "sync"] }
url = "2.5.7"
walkdir = "2.5.0"

sephera_core = { path = "../sephera_core", version = "0.6.0" }
sephera_ignore = { path = "../sephera_ignore", version = "0.6.0" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
tempfile = "3.23.0"