[package]
name = "sephera_graph_javascript"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "JavaScript/TypeScript dependency extraction for Sephera graph."
documentation = "https://docs.rs/sephera_graph_javascript"
readme = "README.md"
keywords = ["javascript", "typescript", "dependencies", "tree-sitter", "npm", "package-json"]
categories = ["development-tools", "text-processing"]

[lib]
name = "sephera_graph_javascript"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
tree-sitter = "0.26"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"

sephera_core = { path = "../sephera_core", version = "0.6.0" }
sephera_graph = { path = "../sephera_graph", version = "0.6.0" }
sephera_symbols = { path = "../sephera_symbols", version = "0.6.0" }