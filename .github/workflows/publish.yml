name: Publish

on:
  workflow_dispatch:
    inputs:
      # The version to publish, typed rather than read from the workflow's ref.
      # A ref can sit on a commit whose `Cargo.toml` says something else, and an
      # upload nobody asked for cannot be undone. The step below refuses a
      # mismatch rather than publishing whichever one it finds.
      version:
        description: Version to publish, matching Cargo.toml
        required: true
      # On by default, so the first thing a run does is prove the plan works
      # rather than upload sixteen crates. A release is the unchecked box.
      dry_run:
        description: Dry run only — package everything, upload nothing
        required: true
        default: true
        type: boolean

concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish crates.io packages
    runs-on: ubuntu-latest
    # Sixteen crates, each waiting for the index, and paced so the registry's
    # new-crate limiter is not hit in the first place. The first real run spent
    # thirteen minutes and was refused at crate 7 of 16 with a 429 -- six crates
    # uploaded inside about eighteen seconds, then "too many new crates in a short
    # period of time, try again after 11:38:22". Four minutes, not an hour: the
    # limiter is a burst limiter, so the cheap response is not to burst.
    #
    # 300 minutes is a ceiling, not an expectation. Paced at 45 s a crate,
    # sixteen crates is about twelve minutes plus the checks. The headroom is for
    # the case where a 429 still lands, which `--publish` rides out by reading the
    # server's own retry time. GitHub caps a job at six hours, so this cannot go
    # higher -- and a run that reaches it is resumable rather than lost, because
    # crates already at the version are skipped.
    timeout-minutes: 300
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm --prefix docs ci

      - name: Validate crates.io token
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            echo "::error::Missing CRATES_IO_TOKEN. Add it to the protected 'release' environment secrets before running this workflow."
            exit 1
          fi

      # The workspace version is the single source of every crate's version,
      # because each manifest inherits it with `version.workspace = true`.
      - name: Read the workspace version
        shell: bash
        run: |
          VERSION="$(python -c '
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
          print(data["workspace"]["package"]["version"])
          ')"
          echo "SEPHERA_VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$VERSION" != "${{ inputs.version }}" ]]; then
            echo "::error::Asked to publish ${{ inputs.version }} but the workspace is $VERSION. Change Cargo.toml, or the input, and re-run."
            exit 1
          fi

      - name: Run release checks
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
          cargo test --workspace
          npm run docs:build

      # One command, and it is the same order and the same patch flags the
      # `publish_dry_run` job verifies in CI -- computed once, by the code that
      # checks them.
      #
      # What this replaces had three crates out of sixteen and two
      # `--config` patches out of forty-five, and it failed with
      # `no matching package named sephera_compression found`: an error naming a
      # *dependency* of the crate being published, which is not where the list
      # went wrong. A list nobody runs is wrong invisibly, which is why the
      # publishing lives next to the verification rather than beside it.
      #
      # The choice is made in bash rather than in a workflow expression.
      # `inputs.dry_run` is a boolean, and GitHub's expression engine casts a
      # boolean and a string to different numbers before comparing them, so
      # `inputs.dry_run != 'true'` is not reliably the negation of what the
      # checkbox says. Handing it to `[[` as a string leaves one interpreter and
      # one interpretation.
      - name: Publish every crate, in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            python scripts/check_publish_order.py --publish
          else
            python scripts/check_publish_order.py --publish --no-dry-run
            echo "Published ${SEPHERA_VERSION}."
          fi

