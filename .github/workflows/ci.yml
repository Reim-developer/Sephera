name: CI

on:
  push:
    branches:
      - master
      - dev
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Rust Fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # `fuzz/` is excluded from the workspace, so the step above never compiles
      # the fuzz targets. Without this, a target that stopped compiling is only
      # found by the fuzz job, which used to report success regardless.
      - name: Run clippy on fuzz targets
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

  test:
    name: Rust Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-insta
        run: cargo install cargo-insta --locked

      # The graph corpus tests skip when the corpus is absent, which is right for
      # an offline developer and wrong for CI: a green run has to mean the
      # accuracy checks actually ran. So the fetch is a step of its own and its
      # failure fails the job.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch graph corpus
        run: python scripts/fetch_corpus.py

      - name: Run tests
        run: cargo test --workspace

      - name: Verify snapshots
        run: cargo insta test --review --workspace

  publish_dry_run:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Dry-run publish sephera_core
        run: cargo publish --dry-run -p sephera_core

      - name: Dry-run publish sephera_mcp with local sephera_core patch
        run: cargo publish --dry-run -p sephera_mcp --config "patch.crates-io.sephera_core.path='crates/sephera_core'"

      - name: Dry-run publish sephera with local patches
        run: cargo publish --dry-run -p sephera --config "patch.crates-io.sephera_core.path='crates/sephera_core'" --config "patch.crates-io.sephera_mcp.path='crates/sephera_mcp'"

  pyright:
    name: Pyright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # `scripts/make_graph_demo.py` imports Pillow and
      # `scripts/probe_symbol_node_kinds.py` imports tree-sitter plus six
      # grammars. Pyright still reports on a file whose imports do not resolve,
      # but every type derived from them becomes unknown, so an unresolvable
      # import turns one missing package into a hundred errors.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages for type checking
        run: pip install -r scripts/requirements-ci.txt

      - name: Run Pyright
        run: npm run pyright

  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm --prefix docs ci

      - name: Build docs site
        run: npm run docs:build

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run benchmark suite
        run: python benchmarks/run.py --datasets small medium large

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: benchmarks/reports/
          if-no-files-found: error

  fuzz_smoke:
    name: Fuzz Smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: scan_content_newlines
            seed_dir: fuzz/seeds/scan_content_newlines
          - target: render_loc_table
            seed_dir: fuzz/seeds/render_loc_table
          - target: build_context_report
            seed_dir: fuzz/seeds/build_context_report
          - target: render_context_markdown
            seed_dir: fuzz/seeds/render_context_markdown
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Create fuzz log and corpus directories
        # libFuzzer exits with "The required directory ... does not exist" rather
        # than creating its corpus directory. `fuzz/seeds/` is gitignored, so a
        # fresh checkout has to make it before the run starts.
        run: mkdir -p fuzz/logs "${{ matrix.seed_dir }}"

      - name: Run fuzz smoke target
        # `pipefail` is required: without it the pipeline reports `tee`'s exit
        # status, so a build failure or a crash in the fuzz target leaves the
        # step green. This job was reporting success while `render_context_markdown`
        # did not compile.
        shell: bash
        run: |
          set -o pipefail
          cargo +nightly fuzz run "${{ matrix.target }}" "${{ matrix.seed_dir }}" -- -max_total_time=60 \
            | tee "fuzz/logs/${{ matrix.target }}.log"

      - name: Upload fuzz smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-${{ matrix.target }}
          path: |
            fuzz/logs/${{ matrix.target }}.log
            fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: warn
