name: CI

on:
  push:
    branches:
      - master
      - dev
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Rust Fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # `fuzz/` is excluded from the workspace, so the step above never compiles
      # the fuzz targets. Without this, a target that stopped compiling is only
      # found by the fuzz job, which used to report success regardless.
      - name: Run clippy on fuzz targets
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

  test:
    name: Rust Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, because `context --diff HEAD~1` is a documented
          # example and the default shallow clone has no `HEAD~1`. Without this
          # the README check fails on a command that is perfectly correct for a
          # user with a real clone.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-insta
        run: cargo install cargo-insta --locked

      # The graph corpus tests skip when the corpus is absent, which is right for
      # an offline developer and wrong for CI: a green run has to mean the
      # accuracy checks actually ran. So the fetch is a step of its own and its
      # failure fails the job.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `SEPHERA_CORPUS_DIR` rather than the default cache location, because the
      # fetcher and the test would otherwise each pick a directory by their own
      # rules. If those two ever disagree the test skips and the job still goes
      # green, which is the one outcome worth preventing here.
      - name: Fetch graph corpus
        env:
          SEPHERA_CORPUS_DIR: ${{ github.workspace }}/.corpus
        run: python scripts/fetch_corpus.py

      - name: Run tests
        run: cargo test --workspace

      - name: Verify snapshots
        run: cargo insta test --review --workspace

      # The README quotes command output verbatim, so both the commands and the
      # numbers they produce are checked. Writing the demo section found a summary
      # table claiming four files where the tool reports seven; without this the
      # next reader would have found it instead.
      - name: Check README examples run
        run: python scripts/check_readme_examples.py

      # The corpus location has to be set here too, not only on the fetch step.
      # Without it the loc table is skipped with a message rather than checked,
      # which is the silent-pass this workflow previously had for the corpus
      # figures themselves.
      - name: Check README figures are current
        env:
          SEPHERA_CORPUS_DIR: ${{ github.workspace }}/.corpus
        run: python scripts/check_readme_figures.py

      - name: Verify the pinned corpus figures
        env:
          SEPHERA_CORPUS_DIR: ${{ github.workspace }}/.corpus
        run: python scripts/measure_accuracy.py --verify

      # The docs are a separate site with its own build, and its content is not
      # checked by anything above. Two failures live there: an unbalanced code
      # fence, which renders the rest of a page as prose, and a path quoted in an
      # example that no longer resolves, which fails when a reader types it.
      # `graph.md` had the first and several pages had the second, so both are
      # worth a check rather than a review.
      - name: Check docs fences and quoted paths
        run: python scripts/check_docs.py

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # The job reads the repository and writes an artifact. Nothing else, so it does
    # not get a token that can push.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      # Gated at 85 while the measured figure is 91.5, which is deliberate. A gate
      # set at the current number is a gate that fails on the next honest commit
      # and gets raised under pressure; one set below it measures regression
      # without inviting filler tests to close the gap. Line coverage is a floor
      # here, not a target -- the count that matters is how much of the *resolver*
      # and *extraction* is exercised, and that is what the fuzz targets in
      # `fuzz.yml` are for.
      #
      # Test files themselves are excluded: they are executed by definition, and
      # including them inflates the number with the tests that check the tests.
      #
      # Two steps, one measurement. `--json --output-path` writes the report to a
      # file and prints nothing -- no table at all, which is why the comment above
      # this once claimed otherwise. `cargo llvm-cov report` then re-renders the
      # per-file table from the data already collected, so the log shows where the
      # numbers came from without a second build.
      - name: Measure line coverage
        run: >-
          cargo llvm-cov --workspace --json
          --output-path coverage-summary.json
          --ignore-filename-regex '(tests?/|benches/|fuzz/)'
          --fail-under-lines 85

      - name: Show the per-file table
        run: >-
          cargo llvm-cov report --summary-only
          --ignore-filename-regex '(tests?/|benches/|fuzz/)'

      # `!cancelled()` rather than the default success condition: the artifact is
      # most needed on the run that failed the gate, which is exactly when the
      # default would skip it.
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary.json
          if-no-files-found: warn

  publish_dry_run:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Dry-run publish sephera_core
        run: cargo publish --dry-run -p sephera_core

      - name: Dry-run publish sephera_mcp with local sephera_core patch
        run: cargo publish --dry-run -p sephera_mcp --config "patch.crates-io.sephera_core.path='crates/sephera_core'"

      - name: Dry-run publish sephera with local patches
        run: cargo publish --dry-run -p sephera --config "patch.crates-io.sephera_core.path='crates/sephera_core'" --config "patch.crates-io.sephera_mcp.path='crates/sephera_mcp'"

  pyright:
    name: Pyright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # `scripts/make_graph_demo.py` imports Pillow and
      # `scripts/probe_symbol_node_kinds.py` imports tree-sitter plus six
      # grammars. Pyright still reports on a file whose imports do not resolve,
      # but every type derived from them becomes unknown, so an unresolvable
      # import turns one missing package into a hundred errors.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages for type checking
        run: pip install -r scripts/requirements-ci.txt

      - name: Run Pyright
        run: npm run pyright

  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm --prefix docs ci

      - name: Build docs site
        run: npm run docs:build

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run benchmark suite
        run: python benchmarks/run.py --datasets small medium large

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: benchmarks/reports/
          if-no-files-found: error

  fuzz_smoke:
    name: Fuzz Smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: scan_content_newlines
            seed_dir: fuzz/seeds/scan_content_newlines
          - target: render_loc_table
            seed_dir: fuzz/seeds/render_loc_table
          - target: build_context_report
            seed_dir: fuzz/seeds/build_context_report
          - target: render_context_markdown
            seed_dir: fuzz/seeds/render_context_markdown
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Create fuzz log and corpus directories
        # libFuzzer exits with "The required directory ... does not exist" rather
        # than creating its corpus directory. `fuzz/seeds/` is gitignored, so a
        # fresh checkout has to make it before the run starts.
        run: mkdir -p fuzz/logs "${{ matrix.seed_dir }}"

      - name: Run fuzz smoke target
        # `pipefail` is required: without it the pipeline reports `tee`'s exit
        # status, so a build failure or a crash in the fuzz target leaves the
        # step green. This job was reporting success while `render_context_markdown`
        # did not compile.
        shell: bash
        run: |
          set -o pipefail
          cargo +nightly fuzz run "${{ matrix.target }}" "${{ matrix.seed_dir }}" -- -max_total_time=60 \
            | tee "fuzz/logs/${{ matrix.target }}.log"

      - name: Upload fuzz smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-${{ matrix.target }}
          path: |
            fuzz/logs/${{ matrix.target }}.log
            fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: warn

  # Renders the coverage and benchmark artifacts onto the pull request, so the
  # two numbers a change moves are visible before it is approved rather than
  # after.
  #
  # `!cancelled()` on the download because a job that failed is exactly the run
  # whose coverage a reviewer needs. Posting a comment saying nothing arrived is
  # still better than posting nothing, and `pr_report.py` renders a missing
  # artifact as `not available` instead of failing -- otherwise a flaky
  # benchmark upload would take the measurement that *did* succeed down with it.
  pr_report:
    name: PR Report
    runs-on: ubuntu-latest
    needs: [coverage, benchmark]
    # A push to `dev` has no pull request, and this job is only meaningful for
    # one. Skipping is what keeps it from failing every direct push.
    if: github.event_name == 'pull_request'
    permissions:
      # Only enough to comment. The job checks out the repository and downloads
      # artifacts; it pushes nothing, so it does not get write access to
      # contents.
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v4
        with:
          name: coverage-summary
          path: artifacts
          continue-on-error: true

      - name: Download benchmark artifact
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v4
        with:
          name: benchmark-reports
          path: artifacts/benchmark-reports
          continue-on-error: true

      - name: Render the report
        run: python scripts/pr_report.py --artifacts artifacts --output report.md

      # Read back rather than piping the command into the action: the marker is
      # what makes the comment replace itself, and a script that printed the
      # marker twice would make this comment grow a duplicate on every push.
      - name: Comment on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const marker = '<!-- sephera-ci-report -->';

            // Replace this workflow's own previous comment rather than adding a
            // new one per push. Filtering on the marker is what makes the PR show
            // one current measurement instead of a pile of stale ones.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const previous = comments.find(
              (comment) => comment.body && comment.body.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
