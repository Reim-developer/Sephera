name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (tag, branch, or commit SHA). Defaults to the selected tag.
        required: false
        type: string
      tag:
        description: Existing git tag to publish or update on GitHub Releases.
        required: true
        type: string
      prerelease:
        description: Mark this manual release as a prerelease.
        required: true
        default: true
        type: boolean
      draft:
        description: Create or update the release as a draft.
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.inputs.tag || github.ref_name || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.prepare.outputs.ref }}
      tag: ${{ steps.prepare.outputs.tag }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
      draft: ${{ steps.prepare.outputs.draft }}
    steps:
      - name: Resolve release metadata
        id: prepare
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            REF="${{ inputs.ref }}"
            TAG="${{ inputs.tag }}"

            if [[ -z "${REF}" ]]; then
              REF="${TAG}"
            fi

            PRERELEASE="${{ inputs.prerelease }}"
            DRAFT="${{ inputs.draft }}"
          else
            REF="${GITHUB_REF}"
            TAG="${GITHUB_REF_NAME}"
            DRAFT="false"
            # A tag push is a stable release unless the tag itself says
            # otherwise: v2.0.0-rc1, v2.1.0-beta2 and v3.0.0-alpha all mark the
            # GitHub Release as a prerelease, so nobody installs an RC thinking
            # it is the final. The manual dispatch keeps its explicit checkbox.
            if [[ "${TAG}" == *-rc* || "${TAG}" == *-beta* || "${TAG}" == *-alpha* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
          fi

          if [[ -z "${TAG}" ]]; then
            echo "::error::Release tag cannot be empty."
            exit 1
          fi

          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "draft=${DRAFT}" >> "$GITHUB_OUTPUT"

  preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Validate manual release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          TAG_COMMIT="$(git rev-parse --verify "refs/tags/${{ needs.prepare.outputs.tag }}^{commit}")"
          HEAD_COMMIT="$(git rev-parse HEAD^{commit})"

          if [[ "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]]; then
            echo "::error::The selected ref does not match refs/tags/${{ needs.prepare.outputs.tag }}."
            echo "::error::Expected ${TAG_COMMIT}, got ${HEAD_COMMIT}."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install docs dependencies
        run: npm --prefix docs ci

      - name: Run release checks
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace
          npm run docs:build

  build:
    name: Build release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs:
      - prepare
      - preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binaries: they run on any Linux new enough to have the
          # kernel, with no glibc floor to think about. That is why both Linux
          # targets are musl rather than gnu -- a gnu binary built on
          # ubuntu-24.04 would refuse to start on anything with glibc < 2.39,
          # and the failure would be silent until a user hit it.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: sephera
            archive_ext: tar.gz
          # Native ARM64 runner (ubuntu-24.04-arm, GA for public repos, managed
          # by Arm): no QEMU, no cross toolchain, just a native build. musl-tools
          # on the ARM image provides the aarch64 musl-gcc the target needs --
          # if that ever stops being true, the loud failure here is the signal
          # to fall back to aarch64-unknown-linux-gnu on the same runner.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary_name: sephera
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: sephera.exe
            archive_ext: zip
          # Windows on ARM (Copilot+ PCs and the like). windows-11-arm is
          # available to public repositories; the VS2026 image migration
          # finished 2026-09-30, so the floating label is the current image.
          # aarch64-pc-windows-msvc is a rustup Tier 2 target with full std.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary_name: sephera.exe
            archive_ext: zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary_name: sephera
            archive_ext: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: sephera
            archive_ext: tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        if: ${{ contains(matrix.target, 'unknown-linux-musl') }}
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build release binary
        run: cargo build --locked --release --bin sephera --target ${{ matrix.target }}

      # Every leg of this matrix is a native runner, so the binary built here
      # can execute right here: --version proves it is the right architecture
      # (a wrong-arch binary fails to execute at all), and a two-file graph
      # run proves extraction and resolution actually work before the archive
      # is uploaded. The first real tag push must not be the first time anyone
      # runs these binaries.
      - name: Smoke-test the built binary
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          "$BIN" --version
          SMOKE_DIR="$(mktemp -d)"
          printf 'from helper import greet\nprint(greet())\n' > "$SMOKE_DIR/main.py"
          printf 'def greet():\n    return "hi"\n' > "$SMOKE_DIR/helper.py"
          "$BIN" graph --format json --path "$SMOKE_DIR" | grep -q "helper.py"
          rm -rf "$SMOKE_DIR"
          case "${{ matrix.target }}" in
            *-linux-*) file "$BIN" | grep -q "statically linked" ;;
            *-apple-*) lipo -info "$BIN" ;;
          esac

      # The GUI used to be a cargo binary built here, but since the Tauri move
      # (PR #37) `crates/sephera_gui` is a view-model *library* and the client
      # is the Tauri app in `gui/`, which ships through its own bundling
      # (per-platform installers via tauri-action), not as a file in this
      # archive. Keeping a `cargo build --bin sephera-gui` step would fail the
      # whole release on a target that no longer exists, so the archive is the
      # CLI plus its license -- the thing `cargo install sephera` gives you.
      - name: Package Windows archive
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $archiveBase = "sephera-${{ needs.prepare.outputs.tag }}-${{ matrix.target }}"
          $packageDir = Join-Path "dist" $archiveBase

          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" (Join-Path $packageDir "${{ matrix.binary_name }}")
          Copy-Item "LICENSE" (Join-Path $packageDir "LICENSE")

          Compress-Archive -Path $packageDir -DestinationPath "dist/$archiveBase.zip" -Force

      - name: Package Unix archive
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          ARCHIVE_BASE="sephera-${{ needs.prepare.outputs.tag }}-${{ matrix.target }}"
          PACKAGE_DIR="dist/${ARCHIVE_BASE}"

          mkdir -p "${PACKAGE_DIR}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${PACKAGE_DIR}/${{ matrix.binary_name }}"
          cp "LICENSE" "${PACKAGE_DIR}/LICENSE"

          tar -C dist -czf "dist/${ARCHIVE_BASE}.tar.gz" "${ARCHIVE_BASE}"

      - name: Upload packaged archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/sephera-${{ needs.prepare.outputs.tag }}-${{ matrix.target }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - prepare
      - build
    permissions:
      contents: write
    steps:
      - name: Download packaged archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum sephera-* > SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          draft: ${{ needs.prepare.outputs.draft == 'true' }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/sephera-*
            release-assets/SHA256SUMS.txt
