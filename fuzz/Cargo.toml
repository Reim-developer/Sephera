[package]
name = "sephera-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
libfuzzer-sys = "0.4.10"
sephera = { path = "../crates/sephera_cli" }
# No `version` on any of these, matching `sephera` above: this crate is
# `publish = false` and lives only inside this repository, so a version field
# would be a second place to keep in step with the workspace for no gain.
sephera_compression = { path = "../crates/sephera_compression" }
sephera_context = { path = "../crates/sephera_context" }
sephera_core = { path = "../crates/sephera_core" }
sephera_graph = { path = "../crates/sephera_graph" }
sephera_ignore = { path = "../crates/sephera_ignore" }
sephera_scan = { path = "../crates/sephera_scan" }
tempfile = "3.23.0"

[[bin]]
name = "scan_content_newlines"
path = "fuzz_targets/scan_content_newlines.rs"
test = false
doc = false
bench = false

[[bin]]
name = "render_loc_table"
path = "fuzz_targets/render_loc_table.rs"
test = false
doc = false
bench = false

[[bin]]
name = "build_context_report"
path = "fuzz_targets/build_context_report.rs"
test = false
doc = false
bench = false

[[bin]]
name = "render_context_markdown"
path = "fuzz_targets/render_context_markdown.rs"
test = false
doc = false
bench = false

[[bin]]
name = "graph_path_utils"
path = "fuzz_targets/graph_path_utils.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resolve_focus_scope"
path = "fuzz_targets/resolve_focus_scope.rs"
test = false
doc = false
bench = false
